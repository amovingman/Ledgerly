default: &default
  adapter: postgresql
  encoding: unicode
  connect_timeout: 2
  checkout_timeout: 2
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "ledgerly") %>
  password: <%= ENV.fetch("DB_PASSWORD", "ledgerly_local") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE", "ledgerly_development") %>

test:
  <<: *default
  # Explicit URL prevents Rails from merging an inherited development DATABASE_URL.
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql:///" + ENV.fetch("TEST_DB_DATABASE", "ledgerly_test")) %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE", "ledgerly_production") %>
