name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      RAILS_ENV: test
      API_KEY: ci-test-key
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TEST_DB_DATABASE: ledgerly_test
      DB_USERNAME: ledgerly
      DB_PASSWORD: ci-postgres-password
      REDIS_URL: redis://127.0.0.1:6379/1
      RAILS_MAX_THREADS: "5"
      STRIPE_SECRET_KEY: sk_test_fixture
      STRIPE_WEBHOOK_SECRET: whsec_fixture
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_DB: ledgerly_test
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly -d ledgerly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8.2.3-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1, verified 2026-11-21
        with:
          # Reads app/.ruby-version and app/Gemfile.lock.
          working-directory: app
          bundler-cache: true
      - name: Run specs, coverage gates, lint, types, RBI drift and autoload checks
        run: bin/ci
      - name: Save coverage and source identity
        if: always()
        run: |
          mkdir -p coverage
          ruby -rjson -e 'File.write("coverage/ci-source.json", JSON.pretty_generate({commit: ENV.fetch("GITHUB_SHA"), run_id: ENV.fetch("GITHUB_RUN_ID"), line_floor: 90, branch_floor: 80}))'
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: coverage-${{ github.sha }}
          path: app/coverage/
          include-hidden-files: true
          retention-days: 14

  compose-smoke:
    needs: test-and-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_KEY: ci-compose-local-key
      READ_CACHE_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Boot from clean Compose services
        run: docker compose up --build -d --wait
      - name: Check HTTP billing and real background execution
        run: |
          curl --fail http://127.0.0.1:3000/up
          curl --fail http://127.0.0.1:3000/ready
          docker compose exec -T api bin/smoke
          docker compose exec -T api ruby script/core_smoke.rb
      - name: Inspect services on failure
        if: failure()
        run: docker compose logs --tail=100 api sidekiq recovery setup
      - name: Remove disposable CI services
        if: always()
        run: docker compose down --volumes
